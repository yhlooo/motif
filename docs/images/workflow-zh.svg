<rect x="42" y="384" width="1016" height="64" rx="12" fill="#e4f1ee" stroke="none"/>
<text x="64" y="424" font-size="19" fill="#087f73" font-weight="600">按顺序组合修改 · 校验 Git 最终状态 · 明确展示未知差异</text>
</g></svg>
