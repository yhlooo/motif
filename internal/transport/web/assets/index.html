<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motif · 意图审查</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><a href="/" class="brand">m<span>otif</span><small>意图驱动的代码审查</small></a><span id="repository"></span><button id="new-review">＋ 创建审查</button></header><div id="error" role="alert" hidden></div><main id="app"><section class="welcome"><span class="eyebrow">WORKSPACE</span><h1>从开发意图理解修改</h1><p>沿着每个逻辑批次阅读代码，追溯真实修改，再做出你的审查决定。</p><div class="list-heading"><h2>代码审查</h2><select id="filter" aria-label="审查状态"><option value="active">进行中</option><option value="all">全部</option><option value="approved">已批准</option></select></div><div id="reviews"></div></section></main><dialog id="create-dialog"><form id="create-form"><span class="eyebrow">NEW REVIEW</span><h2>创建代码审查</h2><label>标题（必填）<input name="title" required autofocus aria-describedby="title-error" placeholder="这次修改实现了什么？"><small id="title-error" class="field-error" hidden>请输入审查标题。</small></label><div class="branches"><label>源分支<select name="source" required></select></label><span>→</span><label>目标分支<select name="target" required></select></label></div><p>使用共同祖先作为基准，审查源分支新增的提交。</p><div id="preview" role="status" aria-live="polite"></div><footer><button type="button" id="cancel-create" class="secondary">取消</button><button type="submit" id="create-button" disabled>创建审查</button></footer></form></dialog></body></html>
